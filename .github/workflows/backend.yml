name: Backend CI/CD

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]


jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: prim
        
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    
    env:
      DATABASE_URL: mysql+pymysql://root:rootpassword@127.0.0.1:3306/prim
      SECRET_KEY: prim2026
      TEST_MODE: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync Dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run Migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: mysql+pymysql://root:rootpassword@127.0.0.1:3306/prim

      - name: Run tests
        run: uv run pytest tests

   